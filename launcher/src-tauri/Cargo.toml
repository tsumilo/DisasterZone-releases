[package]
name = "dz-launcher"
version = "0.3.0"
description = "DisasterZone Launcher: installs and updates the DisasterZone addon"
authors = ["tsumilo"]
license = "MIT"
repository = "https://github.com/tsumilo/DisasterZone-releases"
edition = "2021"
publish = false

[lib]
name = "dz_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
dirs = "7.0.0"
dz-proto = { path = "../proto" }
ed25519-dalek = "2"
flate2 = "1.1.10"
futures = "0.3.34"
hex = "0.4.3"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "charset", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sysinfo = "0.39.6"
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-notification = "2.6.0"
tauri-plugin-opener = "2.7.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-updater = "2.13.3"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["fs", "rt", "macros", "time", "sync"] }
walkdir = "2.5.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }

